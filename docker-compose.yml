version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: thirupal-tech-postgres
    restart: always
    environment:
      POSTGRES_DB: thirupal_tech_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thirupal_tech_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: thirupal-tech-service
    restart: always
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/thirupal_tech_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
