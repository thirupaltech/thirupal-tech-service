
name: Build and Deploy ThirupalTech Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: thirupal-tech-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-2
  AWS_ACCOUNT_ID: "388812949140"
  ECR_REPOSITORY: thirupal-tech-service
  EC2_INSTANCE_ID: i-011946fadaefc3827
  CONTAINER_NAME: thirupal-tech-service
  CONTAINER_PORT: "8081"

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Configure AWS authentication using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::388812949140:role/GitHubActionsThirupalTechDeployRole
          aws-region: ${{ env.AWS_REGION }}

      # 3. Verify AWS identity
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 4. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 5. Generate unique immutable image tag
      - name: Generate image tag
        id: image-tag
        run: |
          IMAGE_TAG="${GITHUB_SHA}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Generated image tag: ${IMAGE_TAG}"

      # 6. Build Docker image
      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Building image: ${IMAGE_URI}"

          docker build \
            -t "${IMAGE_URI}" \
            .

      # 7. Push image to ECR
      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker push "${IMAGE_URI}"

          echo "Successfully pushed: ${IMAGE_URI}"

      # 8. Deploy to EC2 using AWS Systems Manager
      - name: Deploy application to EC2
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          set -euo pipefail

          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Deploying image: ${IMAGE_URI}"
          echo "Target EC2: ${EC2_INSTANCE_ID}"

          # Build the remote deployment script.
          # Database credentials are retrieved securely on EC2.
          REMOTE_SCRIPT=$(cat <<EOF
          set -euo pipefail

          AWS_DEFAULT_REGION="${AWS_REGION}"

          echo "Logging into Amazon ECR..."

          aws ecr get-login-password \
            --region "${AWS_REGION}" | \
            docker login \
              --username AWS \
              --password-stdin "${ECR_REGISTRY}"

          echo "Retrieving database configuration from Parameter Store..."

          DB_HOST=\$(aws ssm get-parameter \
            --name "/thirupal-tech/prod/DB_HOST" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          DB_NAME=\$(aws ssm get-parameter \
            --name "/thirupal-tech/prod/DB_NAME" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          DB_USERNAME=\$(aws ssm get-parameter \
            --name "/thirupal-tech/prod/DB_USERNAME" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          DB_PASSWORD=\$(aws ssm get-parameter \
            --name "/thirupal-tech/prod/DB_PASSWORD" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          echo "Pulling latest application image..."

          docker pull "${IMAGE_URI}"

          echo "Stopping existing container if present..."

          docker stop "${CONTAINER_NAME}" || true
          docker rm "${CONTAINER_NAME}" || true

          echo "Starting new application container..."

          docker run -d \
            --name "${CONTAINER_NAME}" \
            --restart unless-stopped \
            -p "${CONTAINER_PORT}:${CONTAINER_PORT}" \
            -e DB_HOST="\${DB_HOST}" \
            -e DB_NAME="\${DB_NAME}" \
            -e DB_USERNAME="\${DB_USERNAME}" \
            -e DB_PASSWORD="\${DB_PASSWORD}" \
            "${IMAGE_URI}"

          echo "Deployment completed."

          docker ps --filter "name=${CONTAINER_NAME}"

          EOF
          )

          # Send deployment command to EC2
          PARAMETERS=$(jq -n \
            --arg command "$REMOTE_SCRIPT" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "${PARAMETERS}" \
            --timeout-seconds 600 \
            --comment "Deploy ThirupalTech Service ${IMAGE_TAG}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          # Wait for remote deployment to finish
          for attempt in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS}"

            case "${STATUS}" in
              Success)
                echo "EC2 deployment successful."

                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "StandardOutputContent" \
                  --output text

                exit 0
                ;;

              Failed|TimedOut|Cancelled)
                echo "EC2 deployment failed."

                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "{Status:Status,Error:StatusDetails,Output:StandardOutputContent,ErrorOutput:StandardErrorContent}" \
                  --output json

                exit 1
                ;;

              *)
                sleep 5
                ;;
            esac

          done

          echo "Deployment timed out waiting for SSM."
          exit 1
