
name: Build and Deploy ThirupalTech Service

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Build and test Spring Boot application
      - name: Build and test application
        run: mvn -B clean verify

      # 4. Configure AWS credentials using GitHub OIDC
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 5. Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA} .

      # 7. Push Docker image to ECR
      - name: Push Docker image to ECR
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}

      # 8. Display pushed image
      - name: Display pushed image
        run: |
          echo "Image pushed successfully:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"

      # 9. Trigger EC2 deployment using AWS SSM
      - name: Deploy to EC2 using SSM
        id: deploy
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          COMMANDS=$(jq -n \
            --arg cmd "sudo /opt/thirupal-tech/deploy.sh ${GITHUB_SHA}" \
            '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS" \
            --comment "Deploy ThirupalTech ${GITHUB_SHA}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      # 10. Wait for deployment and verify status
      - name: Verify EC2 deployment
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          echo "Waiting for EC2 deployment..."

          for attempt in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment completed successfully!"
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || \
                  "$STATUS" == "Cancelled" || \
                  "$STATUS" == "TimedOut" ]]; then

              echo "Deployment failed. Fetching execution details..."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                --output json

              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out."
          exit 1
