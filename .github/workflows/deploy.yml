
name: Build and Push to Amazon ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test application
        run: mvn -B clean verify

      # Temporary diagnostic step to inspect GitHub OIDC claims
      - name: Debug GitHub OIDC claims
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import base64

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]

          request = urllib.request.Request(
              url + "&audience=sts.amazonaws.com",
              headers={
                  "Authorization": "Bearer " +
                  os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              }
          )

          with urllib.request.urlopen(request) as response:
              token = json.loads(response.read())["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          for key in ["iss", "aud", "sub", "repository", "ref"]:
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA} .

      - name: Push Docker image to ECR
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}

      - name: Display pushed image
        run: |
          echo "Image pushed successfully:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
